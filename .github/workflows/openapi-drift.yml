name: OpenAPI drift

# Weekly check that openapi/openapi.json still matches the public spec.
# It opens no PR by itself: it fails, and the job summary shows what changed.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run sync-openapi
      - name: Compare
        run: |
          if git diff --quiet -- openapi src/generated test/fixtures; then
            echo "No drift" >> "$GITHUB_STEP_SUMMARY"
          else
            git diff --stat -- openapi src/generated test/fixtures >> "$GITHUB_STEP_SUMMARY"
            echo "The public spec changed: run npm run sync-openapi and open a PR." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
